<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer Shield Shape -->
  <path d="M100 30 L160 50 C160 110 145 145 100 170 C55 145 40 110 40 50 L100 30 Z" fill="#0D1117" stroke="#39D5C1" stroke-width="4" stroke-linejoin="round"/>
  
  <!-- Network Nodes & AI Spark -->
  <circle cx="100" cy="85" r="12" fill="none" stroke="#39D5C1" stroke-width="2"/>
  <circle cx="100" cy="85" r="4" fill="#39D5C1">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
  </circle>
  
  <!-- Connection Lines -->
  <line x1="100" y1="97" x2="100" y2="135" stroke="#39D5C1" stroke-width="1.5" stroke-dasharray="2 2"/>
  <line x1="88" y1="85" x2="65" y2="95" stroke="#39D5C1" stroke-width="1.5"/>
  <line x1="112" y1="85" x2="135" y2="95" stroke="#39D5C1" stroke-width="1.5"/>
  
  <!-- Lower Nodes -->
  <circle cx="100" cy="135" r="3" fill="#39D5C1"/>
  <circle cx="65" cy="95" r="3" fill="#39D5C1"/>
  <circle cx="135" cy="95" r="3" fill="#39D5C1"/>
</svg>