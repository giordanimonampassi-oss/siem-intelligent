version: "3.9"

services:
  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: siem_postgres
    environment:
      POSTGRES_DB:       smart_siem
      POSTGRES_USER:     siem_user
      POSTGRES_PASSWORD: siem_password
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siem_user -d smart_siem"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Elasticsearch ──────────────────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: siem_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false   # Désactivé pour le dev local
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 20s
      timeout: 10s
      retries: 10

  # ─── Smart SIEM API ──────────────────────────────────────────────────────────
  siem_api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: siem_api
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://siem_user:siem_password@postgres:5432/smart_siem
      ELASTICSEARCH_URL: http://elasticsearch:9200
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    volumes:
      - ..:/app
  # À AJOUTER dans docker-compose.yml, dans la section "services:"
# (adaptez le chemin "context" si votre dossier frontend n'est pas
#  au même niveau que "backend/docker" — j'ai supposé une structure
#  siem-intelligent/backend/docker/ et siem-intelligent/frontend1/)

  # ─── Frontend (Vite/React) ──────────────────────────────────────────────────
  frontend:
    build:
      context: ../../frontend1
      dockerfile: Dockerfile
    container_name: siem_frontend
    ports:
      - "5173:5173"
    volumes:
      - ../../frontend1:/app
      - /app/node_modules   # évite d'écraser node_modules du conteneur par celui de l'hôte
    environment:
      - CHOKIDAR_USEPOLLING=true   # nécessaire pour le hot-reload dans certains environnements Docker (Windows/WSL2 notamment)
    depends_on:
      - siem_api

# ─────────────────────────────────────────────────────────────────────────────
# Point important à vérifier dans src/api/client.js :
#
#   Le frontend doit appeler http://localhost:8000 (le port mappé sur l'HÔTE),
#   PAS http://siem_api:8000 (nom du service, valable uniquement ENTRE
#   conteneurs sur le réseau Docker interne). Le navigateur de vos camarades
#   tourne sur leur machine hôte, pas dans le réseau Docker — donc il doit
#   viser localhost:8000, exactement comme si le backend tournait nativement.
#
#   Si client.js a une URL en dur (http://localhost:8000), c'est déjà bon.
#   Si elle vient d'une variable d'environnement Vite (import.meta.env.VITE_API_URL),
#   ajoutez dans un fichier .env à la racine de frontend1/ :
#     VITE_API_URL=http://localhost:8000
# ─────────────────────────────────────────────────────────────────────────────

volumes:
  pg_data:
  es_data: